[project]
name = "gemini-screen-ui-kit"
version = "0.1.0"
description = "Pipecat Example showcasing Gemini Live with screen share capabilities"
requires-python = ">=3.10"
dependencies = [
    "loguru>=0.7.3",
    "opentelemetry-exporter-otlp-proto-grpc>=1.38.0",
    "pipecat-ai[cartesia,daily,elevenlabs,google,local-smart-turn-v3,runner,silero,tracing,webrtc]>=0.0.90",
    "pipecatcloud>=0.2.6",
]

[dependency-groups]
dev = [
    "ruff~=0.12.1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
